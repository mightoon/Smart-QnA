<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart QnA 管理控制台</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <a class="logo" href="/docs" target="_blank" rel="noopener" title="查看 API 文档">QnA</a>
      <span class="title">Smart QnA 管理控制台</span>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="chat">问答测试</button>
      <button class="tab" data-tab="config">配置管理</button>
      <button class="tab" data-tab="metrics">可视化监控</button>
    </nav>
    <div class="status">
      <span id="healthDot" class="dot unknown"></span>
      <span id="healthText">检测中…</span>
    </div>
  </header>

  <main class="content">
    <!-- ============ 问答测试 ============ -->
    <section id="tab-chat" class="panel active">
      <div class="chat-layout">
        <div class="chat-main">
          <div id="messages" class="messages">
            <div class="msg system">欢迎使用 Smart QnA 沙盒，输入问题后点击发送即可测试 API 链路。</div>
          </div>
          <div class="composer">
            <textarea id="queryInput" rows="2" placeholder="输入你的问题…"></textarea>
            <button id="sendBtn" class="primary">发送</button>
            <button id="stopBtn" class="danger" hidden>停止</button>
            <button id="clearBtn" class="ghost">清空</button>
          </div>
        </div>
        <aside class="chat-side">
          <h3>检索参数</h3>
          <label>模式
            <select id="modeSelect">
              <option value="">无（纯对话）</option>
              <option value="article">article 文章检索</option>
              <option value="qna">qna 问答检索</option>
              <option value="kg">kg 知识图谱</option>
              <option value="all">all 全部并行</option>
              <option value="merge">merge 融合检索(rerank)</option>
              <option value="vec">vec 向量检索</option>
            </select>
          </label>
          <label>Top K
            <input id="topkInput" type="number" min="1" max="50" value="5" />
          </label>
          <label class="checkbox">
            <input id="streamCheck" type="checkbox" checked /> 流式输出 (SSE)
          </label>
          <label class="checkbox">
            <input id="citeCheck" type="checkbox" checked /> 来源标记
          </label>
          <h3>本次来源</h3>
          <div id="sourceList" class="source-list">—</div>
          <h3>调用接口</h3>
          <div id="apiCall" class="api-call">—</div>
        </aside>
      </div>
    </section>

    <!-- ============ 配置管理 ============ -->
    <section id="tab-config" class="panel config-panel">
      <div class="config-bar">
        <div class="config-inner">
          <button id="loadConfigBtn" class="primary">刷新配置</button>
          <span class="hint">每个工具可配置多份；切换或修改前会验证可用性。敏感字段以 Base64 落盘，展示自动脱敏。</span>
        </div>
      </div>
      <div class="config-scroll">
        <div id="configSections" class="config-sections config-inner"></div>
      </div>
    </section>
    <!-- ============ 可视化监控 ============ -->
    <section id="tab-metrics" class="panel">
      <div class="metrics-bar">
        <label>时间范围
          <select id="metricsRange">
            <option value="1">最近 1 小时</option>
            <option value="6">最近 6 小时</option>
            <option value="24" selected>最近 24 小时</option>
            <option value="168">最近 7 天</option>
          </select>
        </label>
        <button id="refreshMetricsBtn" class="primary small">刷新</button>
        <label class="checkbox"><input id="autoRefreshCheck" type="checkbox" checked /> 自动刷新(30s)</label>
      </div>
      <div class="metrics-content">
        <div class="metrics-cards" id="metricsCards"></div>
        <div class="metrics-charts">
          <div class="chart-box"><h3>请求量趋势</h3><canvas id="chartRequests"></canvas></div>
          <div class="chart-box"><h3>延迟趋势 (ms)</h3><canvas id="chartLatency"></canvas></div>
          <div class="chart-box"><h3>各服务调用次数</h3><canvas id="chartCategories"></canvas></div>
          <div class="chart-box"><h3>Token 消耗</h3><canvas id="chartTokens"></canvas></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    // CDN 加载失败时回退到本地
    if (typeof marked === 'undefined') {
      document.write('<script src="/js/marked.min.js"><\/script>');
    }
  </script>
  <script src="/js/app.js"></script>
  <script src="/js/metrics.js"></script>
</body>
</html>
